# ---------- 按协议的默认 header（合并进该 protocol 的所有模型）----------
protocols:
  responses: {}
  chat_completions: {}
  anthropic_messages:
    # auth: x-api-key
    headers:
      # anthropic-version: "2023-06-01"
  gemini: {}

# ---------- 方法链（可选覆盖）----------
# 内置默认见代码 METHOD_CATALOG；这里可改 prefer / fallback
# methods:
#   gpt.single_replay:
