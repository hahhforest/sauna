# 复制为本目录下的 config.yaml 后填写真实值：
#   cp config.example.yaml config.yaml
#
# 配置哲学（第一性原理）：
#   1. 你声明「有哪些模型可用」（骨架），不是写死 source/decoder 配对。
#   2. 方法自己声明依赖哪些角色（source / decoder / reconciler…）。
#   3. 某角色在 prefer 链上找不到已配置模型 → 明确报错，再走方法级 fallback。
#   4. 没配 gpt 家族 → 不能跑 gpt.*；没配 claude → 不能跑 claude.*。
#
# config.yaml 已 gitignore。环境变量可覆盖 upstream：
#   UPSTREAM_BASE_URL / UPSTREAM_API_KEY / SAUNA_CONFIG

# ---------- 上游网关（必填）----------
upstream:
  base_url: "https://your-upstream.example/v1"
  api_key: "replace-with-your-key"
  # bearer | x-api-key | header | none
  auth: bearer
  # auth_header: "Authorization"
  # auth_prefix: "Bearer "
  headers:
    # HTTP-Referer: "https://github.com/hahhforest/sauna"
    # X-Title: "sauna-reasoning-recovery"
    # anthropic-version: "2023-06-01"

# ---------- 全局运行参数（不是模型配对）----------
runtime:
  effort: high
  max_output_tokens: 4096
  timeout: 120.0
  # 未指定 --method 时，按 family 选默认方法链的第一个可解析项
  default_family: gpt

# ---------- 模型骨架：你配了什么，就能跑什么 ----------
# key = 逻辑名（方法 prefer 链引用的名字，稳定、好记）
# id  = 上游真实 model id
# family = gpt | claude | gemini（决定能跑哪一类方法）
# roles  = 该模型能承担的角色：source | decoder | reconciler
# protocol / headers / model_config 可按模型覆盖
models:
  # —— GPT 家族示例（按需取消注释并改成你的真实 id）——
  sol:
    family: gpt
    id: gpt-5.6-sol
    protocol: responses
    roles: [source]
    # effort: high

  luna:
    family: gpt
    id: gpt-5.6-luna
    protocol: responses
    roles: [decoder]

  terra:
    family: gpt
    id: gpt-5.6-terra
    protocol: responses
    roles: [decoder, reconciler]

  # —— Claude 家族 ——
  # opus:
